version: '3.8'

services:
  skyvern-engine:
    build: .
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - .:/workspace
    command: bash -c "skyvern quickstart & uvicorn src.api.server:api --host 0.0.0.0 --port 8000 & streamlit run src/frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0"